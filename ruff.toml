# Explicit so lint scope doesn't silently drift with ruff releases - newer
# ruff versions have changed their implicit no-config rule defaults (e.g.
# pulling in SIM/UP/RUF/FURB), which isn't what the existing noqa baseline
# in api/scripts/tests was grandfathered against. This pins the classic
# default set (E4, E7, E9, F) that the codebase is actually clean against.
[lint]
select = ["E4", "E7", "E9", "F"]
