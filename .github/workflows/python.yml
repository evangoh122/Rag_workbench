name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "scripts/**"
      - "tests/**"
      - "main.py"
      - "run.py"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # Plain pip + requirements.txt, not a uv workspace (no pyproject.toml/
      # uv.lock exists here, unlike haze_watch) - uv is just a much faster
      # pip-compatible installer for these requirements files, same deps.
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check api scripts tests main.py run.py
      - name: Tests
        run: pytest tests
