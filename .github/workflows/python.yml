name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "scripts/**"
      - "tests/**"
      - "main.py"
      - "run.py"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.23"
      # Dependencies come from pyproject.toml + uv.lock (the `dev` group is
      # installed by default). --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check api scripts tests main.py run.py
      - name: Tests
        # pyproject.toml sets `pythonpath = ["."]` so the suite can import `api`.
        run: uv run pytest tests
