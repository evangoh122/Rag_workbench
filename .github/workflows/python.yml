name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "scripts/**"
      - "tests/**"
      - "main.py"
      - "run.py"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the Dockerfile runtime; 3.12 is the previous CI default.
        # Both are covered by uv.lock (requires-python = ">=3.11") and both
        # pass the full suite (397 passed, 3 runtime-marked tests self-skip).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.23"
      # Fails if pyproject.toml changed without re-locking (uv.lock stale).
      - name: Check uv.lock is up to date
        run: uv lock --check
      # Dependencies come from pyproject.toml + uv.lock (the `dev` group is
      # installed by default). --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check api scripts tests main.py run.py
      - name: Tests
        if: matrix.python-version == '3.11'
        run: uv run pytest tests -m "not spark and not lakebase and not databricks"
      - name: Tests + coverage gate
        # Coverage measured 2026-10-26 on Python 3.12: 49.3% line coverage over
        # api/ + scripts/ (397 passed, 3 skipped, pytest-cov 7.1.0). The gate
        # sits just below the measurement at 48% so coverage regressions fail
        # without flaking on rounding. Only the 3.12 leg gates coverage so the
        # threshold stays bound to one interpreter's measurement.
        if: matrix.python-version == '3.12'
        run: >
          uv run pytest tests -m "not spark and not lakebase and not databricks"
          --cov=api --cov=scripts --cov-report=xml --cov-report=term
          --cov-fail-under=48
      - name: Upload coverage.xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
