name: Security

on:
  push:
    branches: [main]
  # No path filter: secrets can be introduced anywhere, so this runs on every PR.
  pull_request:
  schedule:
    # Weekly full sweep (Mondays 03:41 UTC, off the hour on purpose): the
    # gitleaks job re-scans the whole history even when nothing is pushed.
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Full history, honestly: `--log-opts=--all` scans every commit on every
      # ref fetched by checkout (fetch-depth: 0), not just the PR/push range —
      # the same scan the README documents and the pre-commit hook approximates.
      # The gitleaks binary is pinned by release AND verified against a
      # hardcoded sha256 (no third-party action involved). The repo's
      # .gitleaks.toml (documented allowlist) is passed explicitly.
      - name: gitleaks (pinned 8.28.0, checksum-verified, all refs)
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --log-opts=--all --redact --config .gitleaks.toml

  trufflehog:
    name: Secret scanning (TruffleHog, verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Verified-only: a finding fails the job only after TruffleHog has
      # confirmed the credential live against its provider, so the gate has no
      # unverified-secret noise. The action passes --fail, so any verified
      # secret in the scanned range fails the job. On pull_request the range is
      # base.sha..head.sha (new commits); the gitleaks job above covers the
      # full history.
      - name: TruffleHog (verified secrets)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: "3.99.7"
          extra_args: --only-verified

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.23"
      # Audit the exact locked tree without syncing the ML stack: uv exports
      # pyproject.toml + uv.lock to a pinned requirements file, pip-audit scans
      # it. Hashes are omitted because pip-audit resolves the pins via pip.
      - name: Export locked requirements
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --format requirements-txt -o /tmp/requirements-audit.txt >/dev/null
          # torch is pinned to the CPU index (e.g. torch==2.14.1+cpu); PyPI has
          # no PEP 440 local-build variant, so strip the +cpu suffix. pip-audit
          # then checks torch against its public version (advisories are keyed
          # by release, not build tag).
          sed -i -E 's/^(torch==[^ ;]*)\+[A-Za-z0-9.]+/\1/' /tmp/requirements-audit.txt
          grep -q '^torch==' /tmp/requirements-audit.txt
      - name: pip-audit (backend)
        # Python 3.11 matches the project (Dockerfile) so pip resolves the same
        # versions; uvx otherwise picks the runner's newest interpreter.
        run: uvx --python 3.11 --from pip-audit pip-audit --no-deps -r /tmp/requirements-audit.txt

  dependency-review:
    name: Dependency review (introduced advisories)
    # The action diffs the PR's dependency manifests/lockfiles against the base
    # branch, so it only means something on pull_request events.
    # Prerequisite: the repo's Dependency graph must be enabled (Settings >
    # Code security > Dependency graph) — until then this job fails with
    # "Dependency graph not supported on this repository". Kept blocking on
    # purpose (not silently disabled); see README "CI & security".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Blocks a PR that introduces a dependency version with a known advisory
      # (default severity floor: low). Changes to uv.lock / pyproject.toml are
      # what it evaluates; PRs without dependency changes pass trivially.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  bandit:
    name: SAST (bandit, medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.23"
      # -ll fails on MEDIUM and HIGH severity findings. The documented baseline
      # lives in [tool.bandit] (pyproject.toml) plus per-site `# nosec` notes;
      # see README "CI & security" for the findings table. Pinned to the exact
      # bandit release the baseline was recorded with.
      - name: bandit (medium+ severity)
        run: uv run --with bandit==1.9.4 bandit -c pyproject.toml -r api scripts main.py run.py -ll
