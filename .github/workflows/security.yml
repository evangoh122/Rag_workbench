name: Security

on:
  push:
    branches: [main]
  # No path filter: secrets can be introduced anywhere, so this runs on every PR.
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.23"
      # Audit the exact locked tree without syncing the ML stack: uv exports
      # pyproject.toml + uv.lock to a requirements file, pip-audit scans it.
      - name: Export locked requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
      - name: pip-audit (backend)
        run: uvx --from pip-audit pip-audit -r /tmp/requirements-audit.txt
