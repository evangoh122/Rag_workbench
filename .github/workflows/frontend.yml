name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # npm install, not npm ci: the committed lockfile was generated on
      # Windows and is missing Linux-only optional deps (@emnapi/core etc.),
      # which `npm ci` treats as a hard mismatch. `npm install` is what the
      # production Dockerfile already uses for the same reason - matching it
      # here means CI reflects the real build, not a stricter invented one.
      - run: npm install
      - run: npm run lint
      # No separate typecheck/test scripts exist yet — `build` already runs
      # `tsc -b` before `vite build`, so it's the typecheck gate for now.
      - run: npm run build
