# zizmor configuration — see README "CI & security" for how this gate runs.
#
# The two ignore lists below hold PRE-EXISTING findings in workflows that a
# different PR is currently rewriting (owner instruction 2026-10-26: this PR
# must not touch refresh-filings.yml or embed-annuals.yml). They are listed
# honestly rather than silently suppressed:
#
#   embed-annuals.yml    artipacked       — checkout without persist-credentials: false
#                        template-injection (x2, low confidence) — ${{ steps.guard.outputs.summary }}
#                                          interpolated into a git commit message
#   refresh-filings.yml  artipacked       — checkout without persist-credentials: false
#                        template-injection (x2, low confidence) — same commit-message pattern
#
# Entries are keyed by rule + file WITHOUT line anchors on purpose: PR #25
# (fix/db-copy-hf-runner) rewrites both workflows, and line anchors would
# drift and turn the gate red through no fault of that PR. The trade-off is
# stated in the README: while these entries exist, NEW findings of these two
# rules in these two files will not be caught — so remove each entry as soon
# as the owning PR lands (or as soon as zizmor reports those files clean).
# deploy.yml's findings of the same kinds were fixed in this PR instead of
# being ignored.
rules:
  artipacked:
    ignore:
      - embed-annuals.yml
      - refresh-filings.yml
  template-injection:
    ignore:
      - embed-annuals.yml
      - refresh-filings.yml
